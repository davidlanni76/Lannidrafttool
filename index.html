<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Draft Day AI — Championship Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --bg2:#0e1626; --panel:#141f2f; --panel2:#1a2739; --raise:#20304a;
  --line:#26364b; --line2:#32465f;
  --ink:#eaf1fa; --muted:#8497b2; --faint:#5c6f8a;
  --go:#28c076; --go2:#1e9a5d; --gold:#f2b33d; --red:#ff5d6c; --blue:#4aa8ff;
  --qb:#c07bff; --rb:#3ddc84; --wr:#4aa8ff; --te:#ff9d42; --k:#9fb0c9; --dst:#7d8ba3; --flex:#e2c56a;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #16233a 0%, rgba(22,35,58,0) 60%),
    linear-gradient(180deg,#0b1220 0%, #0a1019 100%);
  color:var(--ink);
  font-family:"Barlow",system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
h1,h2,h3,.disp{font-family:"Saira Condensed",sans-serif;letter-spacing:.01em}
.mono{font-family:"Share Tech Mono",monospace}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
input,select{font-family:inherit}
::selection{background:rgba(40,192,118,.35)}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(11,18,32,.96),rgba(11,18,32,.78));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--go);box-shadow:0 0 12px var(--go);flex:none}
.brand b{font-family:"Saira Condensed";font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--faint);font-size:11px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel);color:var(--muted);font-weight:600;font-size:13px;
}
.tb-btn:hover{color:var(--ink);border-color:var(--go2)}
.mode-seg{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.mode-seg button{padding:7px 13px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mode-seg button.on{background:var(--go);color:#04130b}

.wrap{max-width:1180px;margin:0 auto;padding:14px}
@media(min-width:980px){
  .grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  .col-side{position:sticky;top:70px}
}

/* ---- scoreboard / recommendation ---- */
.board-hero{
  border:1px solid var(--line2);border-radius:16px;overflow:hidden;margin-bottom:16px;
  background:
    linear-gradient(180deg,#12203a 0%, #101a2b 100%);
  box-shadow:var(--shadow);
}
.hero-top{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 8px);
}
.onclock{font-family:"Saira Condensed";font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--go)}
.onclock.notme{color:var(--muted)}
.pickno{font-family:"Saira Condensed";font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.05em}
.pickno b{color:var(--ink)}
.timer{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{
  font-family:"Share Tech Mono";font-size:26px;line-height:1;color:var(--ink);
  padding:4px 10px;border:1px solid var(--line2);border-radius:8px;background:#0a1220;min-width:74px;text-align:center;
}
.clock.warn{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.clock-btn{padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--muted);font-weight:700;font-size:12px}

.rec-body{padding:16px}
.rec-empty{padding:26px 18px;text-align:center;color:var(--muted)}
.rec-flag{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.rec-main{display:flex;gap:16px;align-items:stretch}
.rec-score{
  flex:none;width:96px;border-radius:14px;border:1px solid var(--line2);
  background:linear-gradient(180deg,#0c1626,#0a1220);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;
}
.rec-score .n{font-family:"Saira Condensed";font-weight:800;font-size:52px;line-height:.9;color:var(--go)}
.rec-score .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.rec-info{flex:1;min-width:0;display:flex;flex-direction:column}
.rec-name{font-family:"Saira Condensed";font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em}
.rec-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.why{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.why li{font-size:13.5px;color:#cfe0f2;display:flex;gap:8px;align-items:flex-start}
.why li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--go);margin-top:6px;flex:none}
.why li.warn::before{background:var(--red)}
.why li.val::before{background:var(--gold)}
.rec-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.big-draft{
  flex:1;min-width:150px;padding:14px;border-radius:12px;background:var(--go);color:#04130b;
  font-family:"Saira Condensed";font-weight:800;font-size:19px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 6px 18px rgba(40,192,118,.32);
}
.big-draft:hover{background:#31d182}
.ghost{
  padding:14px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);
  font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
}
.ghost:hover{color:var(--ink);border-color:var(--go2)}
.ghost.danger:hover{color:var(--red);border-color:var(--red)}

.next-opts{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.next-opts .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.opt-row{display:flex;align-items:center;gap:10px;padding:6px 2px;cursor:pointer;border-radius:8px}
.opt-row:hover{background:var(--panel)}
.opt-rank{font-family:"Saira Condensed";font-weight:700;color:var(--faint);width:16px}
.opt-sc{font-family:"Saira Condensed";font-weight:800;font-size:16px;margin-left:auto;color:var(--ink)}
.waiton{margin-top:10px;font-size:12.5px;color:var(--muted)}
.waiton b{color:var(--gold)}
.sv-chip{font-family:"Share Tech Mono";font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid transparent;white-space:nowrap}
.sv-take{color:var(--red);background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.35)}
.sv-flip{color:var(--gold);background:rgba(242,179,61,.10);border-color:rgba(242,179,61,.30)}
.sv-wait{color:var(--go);background:rgba(40,192,118,.12);border-color:rgba(40,192,118,.30)}
.sv-read{margin-top:10px;font-size:12.5px;line-height:1.4;padding:8px 11px;border-radius:9px;border-left:3px solid}
.sv-read.sv-take{border-color:var(--red);background:rgba(255,93,108,.07);color:#ffd0d5}
.sv-read.sv-flip{border-color:var(--gold);background:rgba(242,179,61,.06);color:#f3dfb0}
.sv-read.sv-wait{border-color:var(--go);background:rgba(40,192,118,.07);color:#bfeAd4}
.bye-warn{margin-top:9px;font-size:12px;color:#f3dfb0;background:rgba(242,179,61,.08);border:1px solid rgba(242,179,61,.3);border-radius:8px;padding:7px 9px}
.next-opts.split{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:560px){.next-opts.split{grid-template-columns:1fr 1fr}}
.no-col{min-width:0}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.posbox{
  border:1px solid var(--line);border-left:3px solid var(--pc,var(--faint));border-radius:9px;
  background:#0c1626;padding:6px 8px;cursor:pointer;min-width:0;
}
.posbox:hover{border-color:var(--line2);background:var(--panel)}
.posbox.gone{opacity:.4}
.posbox .pb-pos{font-family:"Saira Condensed";font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--pc)}
.posbox .pb-name{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;line-height:1.15}
.posbox .pb-meta{display:flex;align-items:baseline;gap:5px;margin-top:3px}
.posbox .pb-adp{font-family:"Share Tech Mono";font-size:10px;color:var(--faint)}
.posbox .pb-champ{font-family:"Saira Condensed";font-weight:800;font-size:15px;margin-left:auto;line-height:1}

/* panic */
.panic-bar{display:flex;gap:10px;padding:0 16px 16px}
.panic{
  flex:1;padding:11px;border-radius:11px;border:1px solid var(--gold);
  background:rgba(242,179,61,.08);color:var(--gold);
  font-family:"Saira Condensed";font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
}
.panic:hover{background:rgba(242,179,61,.16)}

/* ---- tabs (mobile) ---- */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
}
.tabs button.on{background:var(--panel2);color:var(--ink);border-color:var(--go2)}
.tabs .cnt{font-family:"Share Tech Mono";font-size:11px;opacity:.7;margin-left:5px}
@media(min-width:980px){.tabs{display:none}}

/* ---- filters ---- */
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 11px;border-radius:20px;border:1px solid var(--line2);background:var(--panel);
  font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--muted);
}
.chip.on{color:var(--ink);border-width:1px}
.chip[data-p="ALL"].on{border-color:var(--go);color:var(--go)}
.chip[data-p="QB"].on{border-color:var(--qb);color:var(--qb)}
.chip[data-p="RB"].on{border-color:var(--rb);color:var(--rb)}
.chip[data-p="WR"].on{border-color:var(--wr);color:var(--wr)}
.chip[data-p="TE"].on{border-color:var(--te);color:var(--te)}
.chip[data-p="FLEX"].on{border-color:var(--flex);color:var(--flex)}
.chip[data-p="K"].on{border-color:var(--k);color:var(--k)}
.chip[data-p="DST"].on{border-color:var(--dst);color:var(--dst)}
.search{
  flex:1;min-width:130px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);
  background:#0a1220;color:var(--ink);font-size:14px;
}
.search::placeholder{color:var(--faint)}
.sortsel{padding:9px 10px;border-radius:10px;border:1px solid var(--line2);background:#0a1220;color:var(--muted);font-weight:600;font-size:12.5px}

/* ---- player rows ---- */
.sv-legend{font-size:11.5px;color:var(--faint);margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sv-legend .sv-chip{font-family:"Barlow";font-size:10px}
.list{display:flex;flex-direction:column;gap:7px}
.prow{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);position:relative;
  border-left:4px solid var(--pc,var(--faint));
}
.prow:hover{border-color:var(--line2);background:var(--panel2)}
.prow.mine{border-color:var(--go2);background:rgba(40,192,118,.06)}
.prow.faded{opacity:.5}
.prow.faded .p-name{text-decoration:line-through}
.pc-QB{--pc:var(--qb)} .pc-RB{--pc:var(--rb)} .pc-WR{--pc:var(--wr)}
.pc-TE{--pc:var(--te)} .pc-K{--pc:var(--k)} .pc-DST{--pc:var(--dst)}
.p-pos{
  flex:none;width:40px;text-align:center;font-family:"Saira Condensed";font-weight:700;font-size:12px;
  color:var(--pc);letter-spacing:.03em;
}
.p-pos .pr{display:block;font-size:10px;color:var(--faint);font-weight:600}
.p-id{flex:1;min-width:0;cursor:pointer}
.p-name{font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-name .star{color:var(--gold);margin-right:3px}
.p-sub{font-size:11.5px;color:var(--faint);display:flex;gap:7px;margin-top:1px;white-space:nowrap;overflow:hidden}
.p-mid{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;width:62px}
.p-adp{font-family:"Share Tech Mono"}
.tierpill{color:var(--muted)}
.p-val{font-family:"Saira Condensed";font-weight:700;font-size:14px;width:44px;text-align:right}
.p-val.pos{color:var(--go)} .p-val.neg{color:var(--red)} .p-val.neu{color:var(--faint)}
.p-champ{
  flex:none;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:"Saira Condensed";font-weight:800;font-size:19px;border:1px solid var(--line2);background:#0c1626;
}
.p-act{flex:none;display:flex;gap:5px}
.qbtn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);
}
.qbtn:hover{color:var(--ink);border-color:var(--go2)}
.qbtn.me:hover{color:var(--go);border-color:var(--go)}
.qbtn.watch.on{color:var(--gold);border-color:var(--gold)}
.action-tag{font-family:"Saira Condensed";font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.at-draft{color:var(--go);background:rgba(40,192,118,.12)}
.at-consider{color:var(--gold);background:rgba(242,179,61,.12)}
.at-avoid{color:var(--red);background:rgba(255,93,108,.10)}
.list-end{text-align:center;color:var(--faint);font-size:12px;padding:14px}

/* ---- side panels ---- */
.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.needs{display:flex;flex-direction:column;gap:9px}
.need-row{display:flex;align-items:center;gap:10px}
.need-pos{font-family:"Saira Condensed";font-weight:700;width:34px;color:var(--pc,var(--ink))}
.bar{flex:1;height:8px;border-radius:5px;background:#0a1220;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pc,var(--go));border-radius:5px}
.need-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;width:56px;text-align:right}
.need-lbl.need{color:var(--red)} .need-lbl.ok{color:var(--gold)} .need-lbl.good{color:var(--go)}
.roster{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.slot{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;background:#0c1626;border:1px solid var(--line)}
.slot .sl{font-family:"Saira Condensed";font-weight:700;font-size:11px;color:var(--faint);width:38px;letter-spacing:.06em}
.slot .sn{font-weight:600;font-size:13.5px}
.slot.empty .sn{color:var(--faint);font-style:italic;font-weight:500}
.slot .snq{margin-left:auto;font-family:"Share Tech Mono";font-size:11px;color:var(--faint)}

.qsec{margin-bottom:14px}
.qsec .qh{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.qsec .qh b{margin-left:auto;font-family:"Share Tech Mono";color:var(--faint)}
.qitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#0c1626;margin-bottom:5px}
.qitem .qn{font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qx{margin-left:auto;color:var(--faint);font-size:15px;padding:0 3px}
.qitem .qx:hover{color:var(--red)}
.qitem.gone{opacity:.45}.qitem.gone .qn{text-decoration:line-through}
.qempty{font-size:12px;color:var(--faint);font-style:italic;padding:2px 0 8px}

/* ---- research table ---- */
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{
  text-align:left;padding:8px 8px;font-family:"Saira Condensed";font-weight:700;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2);
  position:sticky;top:56px;background:var(--bg);cursor:pointer;white-space:nowrap;
}
.rtable th:hover{color:var(--ink)}
.rtable td{padding:7px 8px;border-bottom:1px solid var(--line)}
.rtable tr:hover td{background:var(--panel)}
.rtable .num{font-family:"Share Tech Mono";text-align:center}
.rtable .ed{width:46px;padding:3px 5px;border-radius:6px;border:1px solid var(--line2);background:#0a1220;color:var(--ink);text-align:center;font-family:"Share Tech Mono";font-size:12px}
.rtable .ed:focus{border-color:var(--go);outline:none}
.rposdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.r-note{width:100%;padding:3px 6px;border-radius:6px;border:1px solid var(--line2);background:#0a1220;color:var(--ink);font-size:12px}
.research-hint{font-size:12.5px;color:var(--muted);background:rgba(74,168,255,.06);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.5}

/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(5,9,16,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.on{display:flex}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{
  width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg2);
  border:1px solid var(--line2);border-radius:18px 18px 0 0;box-shadow:var(--shadow);
}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-head .mtitle{flex:1;min-width:0}
.modal-head .mname{font-family:"Saira Condensed";font-weight:800;font-size:26px;line-height:1}
.modal-head .msub{color:var(--muted);font-size:13px;margin-top:4px}
.mx{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:18px;flex:none}
.mx:hover{color:var(--ink)}
.modal-body{padding:18px}
.mstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.mstat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.mstat .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mstat .v{font-family:"Saira Condensed";font-weight:700;font-size:20px;margin-top:3px}
.slider-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.slider-row label{width:78px;font-size:12px;font-weight:600;color:var(--muted);text-transform:capitalize}
.slider-row input[type=range]{flex:1;accent-color:var(--go)}
.slider-row .sv{font-family:"Share Tech Mono";width:28px;text-align:right;font-size:13px}
.modal-acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.modal-acts button{padding:12px;border-radius:11px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.modal-acts .m-me{background:var(--go);color:#04130b;border-color:var(--go)}
.modal-acts .m-fade:hover{border-color:var(--red);color:var(--red)}
.modal-acts .m-watch.on{border-color:var(--gold);color:var(--gold)}

/* settings */
.set-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.set-row label{flex:1;font-size:14px}
.set-row .hint{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.set-row input,.set-row select{width:88px;padding:8px;border-radius:9px;border:1px solid var(--line2);background:#0a1220;color:var(--ink);text-align:center;font-size:14px}
.slotset{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 4px}
.slotset .ss{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.slotset .ss span{flex:1;font-size:13px;font-weight:600}
.slotset .ss input{width:46px;padding:5px;border-radius:7px;border:1px solid var(--line2);background:#0a1220;color:var(--ink);text-align:center}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  padding:11px 18px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .u{color:var(--gold);text-decoration:underline;cursor:pointer;margin-left:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
input[type=file]{display:none}
.mini{font-size:11px;color:var(--faint)}
</style>
</head>

<div class="topbar">

</div>

<div class="wrap">
  <!-- DRAFT MODE -->
  <div id="draftMode">
    <div class="grid">
      <div class="col-main">

        <div class="tabs" id="tabs">

          <button data-view="queue">Queue <span class="cnt" id="cntQueue"></span></button>

        <div id="viewBoard">

            <div class="chips" id="posChips">

              <button class="chip" data-p="RB">RB</button>
              <button class="chip" data-p="WR">WR</button>
              <button class="chip" data-p="TE">TE</button>
              <button class="chip" data-p="FLEX">Flex</button>
              <button class="chip" data-p="K">K</button>
              <button class="chip" data-p="DST">DST</button>
            </div>
            <input class="search" id="search" placeholder="Search players…">
            <select class="sortsel" id="sortSel">
              <option value="champ">Sort: Champ Score</option>
              <option value="adp">Sort: ADP</option>
              <option value="value">Sort: Value</option>
            </select>
          </div>
          <div class="sv-legend">% = odds the player is still available at <b>your next pick</b> · <span class="sv-chip sv-take">take now</span> <span class="sv-chip sv-flip">50/50</span> <span class="sv-chip sv-wait">can wait</span></div>
          <div class="list" id="boardList"></div>
        </div>

        <div id="viewTeam" class="hidden">
          <div class="panel" id="needsPanel"></div>
          <div class="panel" id="rosterPanel"></div>
        </div>

        <div id="viewQueue" class="hidden">
          <div class="panel" id="queuePanel"></div>
        </div>
      </div>

      <!-- desktop side column -->
      <div class="col-side" id="sideCol">
        <div class="panel" id="needsPanelD"></div>
        <div class="panel" id="rosterPanelD"></div>
        <div class="panel" id="queuePanelD"></div>
      </div>
    </div>
  </div>

  <!-- RESEARCH MODE -->
  <div id="researchMode" class="hidden">
    <div class="research-hint" id="researchHint"></div>
    <div class="filters">
      <div class="chips" id="posChipsR">
        <button class="chip on" data-p="ALL">All</button>
        <button class="chip" data-p="QB">QB</button>
        <button class="chip" data-p="RB">RB</button>
        <button class="chip" data-p="WR">WR</button>
        <button class="chip" data-p="TE">TE</button>
        <button class="chip" data-p="K">K</button>
        <button class="chip" data-p="DST">DST</button>
      </div>
      <input class="search" id="searchR" placeholder="Search players…">
      <label class="tb-btn" style="cursor:pointer"><input type="checkbox" id="hideDrafted" style="margin-right:6px">Hide drafted</label>
    </div>
    <div style="overflow:auto">
      <table class="rtable" id="rtable"></table>
    </div>
  </div>
</div>

<!-- player modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>
<!-- settings modal -->
<div class="modal-bg" id="setBg">

</div>
<!-- save modal -->
<div class="modal-bg" id="saveBg">

/* ---------- state ---------- */
let league = load("ddai_league", structuredClone(DEFAULT_LEAGUE));
let edits  = load("ddai_edits", {});      // id -> {offense,role,schedule,upside,risk,note,bye}
let drafted = load("ddai_drafted", []);   // ordered [{id, by}]  by = 'me' or team number
let watch  = load("ddai_watch", {});      // id -> tag ('target'|'value'|'flyer')
let fade   = load("ddai_fade", {});       // id -> true
let ui = { mode:"draft", view:"board", posFilter:"ALL", posFilterR:"ALL",
           search:"", searchR:"", sort:"champ", hideDrafted:false };

/* ---------- build player objects ---------- */
const PLAYERS = RAW.map((r,i)=>{
  const [adp,name,team,pos,posRank,bye,sd] = r;
  return { id:i, adp, name, team, pos, posRank, byeWk:bye||null, sd:(sd&&sd>0?sd:6) };
});
const byId = id => PLAYERS[id];

/* derive tiers per position from ADP gaps */
(function buildTiers(){
  const gap = { QB:11, RB:9, WR:9, TE:8, K:99, DST:99 };
  POS_ORDER.forEach(pos=>{
    const list = PLAYERS.filter(p=>p.pos===pos).sort((a,b)=>a.adp-b.adp);
    let tier=1;
    list.forEach((p,idx)=>{
      if(idx>0 && (p.adp - list[idx-1].adp) > (gap[pos]||9)) tier++;
      p.tier = tier;
    });
  });
})();

/* default subjective scores keyed to ADP (honest placeholders, editable).
   offense/role/upside scale with draft cost; schedule neutral (unknown);
   risk mild default. */
function baseScores(p){
  const b = clamp(Math.round(103 - p.adp*0.42), 22, 99);
  const upsideBoost = p.adp > 100 ? 8 : 0;   // late picks drafted for ceiling
  return {
    offense: b,
    role: b,
    schedule: 58,
    upside: clamp(b + upsideBoost, 22, 99),
    risk: 25,
    note: "",
    bye: p.byeWk || null
  };
}
function scores(p){
  const base = baseScores(p);
  const e = edits[p.id] || {};
  return { ...base, ...e };
}

/* ============================================================
   SNAKE DRAFT MATH
   ============================================================ */
const draftedIds = () => new Set(drafted.map(d=>d.id));
function overallToTeam(pick){          // 1-indexed overall pick -> team (1..teams)
  const T = league.teams;
  const round = Math.ceil(pick / T);
  const idx = pick - (round-1)*T;      // 1..T
  return (round % 2 === 1) ? idx : (T - idx + 1);
}
const currentOverall = () => drafted.length + 1;
function myPickNumbers(){               // list of overall picks that are mine
  const out=[]; const total = league.teams*league.rounds;
  for(let p=1;p<=total;p++) if(overallToTeam(p)===league.slot) out.push(p);
  return out;
}
function nextMyPick(){                  // next overall pick that is mine (>= current)
  const cur=currentOverall();
  return myPickNumbers().find(p=>p>=cur) || null;
}
function pickLabel(overall){            // -> "5.08"
  overall=Math.max(1,Math.round(overall));
  const T=league.teams, round=Math.ceil(overall/T), idx=overall-(round-1)*T;
  return round + "." + String(idx).padStart(2,"0");
}
/* ---- survival probability: will a player still be on the board at a later pick? ---- */
function normCdf(z){ // Abramowitz-Stegun 7.1.26
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989422804014327*Math.exp(-z*z/2);
  const p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0?1-p:p;
}
// P(player still available AT overall pick `toPick`) = P(draftPosition >= toPick)
function survivalTo(p, toPick){
  if(!toPick) return null;
  const sd=p.sd&&p.sd>0?p.sd:6;
  return clamp(1 - normCdf((toPick - p.adp)/sd), 0, 1);
}
// the pick after my current recommendation pick — the one survival is measured to
function survivalTarget(){
  const recPick=nextMyPick();
  if(recPick===null) return null;
  return myPickNumbers().find(p=>p>recPick) || null;
}
function survivalTag(prob){
  if(prob==null) return null;
  const pct=Math.round(prob*100);
  if(pct<25) return {pct, cls:"sv-take", word:"take now"};
  if(pct<=60) return {pct, cls:"sv-flip", word:"50/50"};
  return {pct, cls:"sv-wait", word:"will return"};
}
function myRoundNow(){                   // which of MY rounds am I drafting (1..rounds)
  const mine = drafted.filter(d=>d.by==="me").length;
  return Math.min(mine+1, league.rounds);
}
const isMyTurn = () => overallToTeam(currentOverall())===league.slot;

/* ============================================================
   ROSTER ANALYSIS
   ============================================================ */
function myRoster(){ return drafted.filter(d=>d.by==="me").map(d=>byId(d.id)); }

function rosterCounts(){
  const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
  myRoster().forEach(p=>c[p.pos]++);
  return c;
}

/* fill starting slots greedily by ADP; returns {slots:[{slot,player}], needs:{pos:remaining}} */
function rosterFill(){
  const S=league.starters;
  const slots=[];
  const pool=myRoster().slice().sort((a,b)=>a.adp-b.adp);
  const used=new Set();
  const take=(pos)=>{
    const p=pool.find(x=>!used.has(x.id)&&x.pos===pos);
    if(p) used.add(p.id); return p;
  };
  const takeFlex=()=>{
    const p=pool.find(x=>!used.has(x.id)&&FLEX_POS.includes(x.pos));
    if(p) used.add(p.id); return p;
  };
  const order=[["QB",S.QB],["RB",S.RB],["WR",S.WR],["TE",S.TE],["FLEX",S.FLEX],["K",S.K],["DST",S.DST]];
  const needs={QB:0,RB:0,WR:0,TE:0,FLEX:0,K:0,DST:0};
  order.forEach(([slot,n])=>{
    for(let i=0;i<n;i++){
      const p = slot==="FLEX"?takeFlex():take(slot);
      slots.push({slot,player:p||null});
      if(!p) needs[slot]++;
    }
  });
  const beNames=[]; pool.forEach(p=>{ if(!used.has(p.id)) beNames.push(p); });
  return {slots, needs, bench:beNames};
}

/* need weight for a position: how badly do we want it right now */
function needWeight(pos){
  const {needs}=rosterFill();
  const c=rosterCounts();
  let w=0;
  if(pos==="K"||pos==="DST"){
    if(needs[pos]>0){
      // only "needed" in the last rounds — otherwise strongly deprioritized
      const round=myRoundNow();
      return round >= league.rounds-2 ? 6 : -40;
    }
    return -60;
  }
  if(pos==="QB"){
    if(needs.QB>0) w=8; else w=-30;        // 1-QB league: no second starter value
    return w;
  }
  if(needs[pos]>0) w+=9;                    // unfilled dedicated starter
  else if(needs.FLEX>0 && FLEX_POS.includes(pos)) w+=4; // can fill flex
  // depth penalty if already stacked well past starters
  const req=(league.starters[pos]||0);
  if(c[pos] >= req+3) w-=6;
  else if(c[pos] >= req+2) w-=2;
  return w;
}

/* ============================================================
   SCORING ENGINE
   ============================================================ */
function phaseOf(round){
  if(round<=4) return "early";
  if(round<=10) return "mid";
  return "late";
}
const PHASE_W = {
  early:{role:.35,off:.30,sch:.15,ups:.20,risk:.35,val:.45},
  mid:  {role:.25,off:.25,sch:.15,ups:.35,risk:.20,val:.75},
  late: {role:.10,off:.20,sch:.10,ups:.60,risk:.05,val:.50},
};

/* value = how far past ADP a player is available at the pick we're evaluating for */
function valueAt(p, overallPick){
  return overallPick - p.adp;   // + = falling (good), - = reach
}

/* live scarcity: is p the last available in their pos-tier, with a startable need? */
function scarcityInfo(p, availSet){
  const sameTier = PLAYERS.filter(x=>x.pos===p.pos && x.tier===p.tier && availSet.has(x.id));
  const lastInTier = sameTier.length<=1;
  // depth after this tier still available at pos
  const better = PLAYERS.filter(x=>x.pos===p.pos && x.tier<p.tier && availSet.has(x.id)).length;
  return { lastInTier, tierRemaining:sameTier.length, better };
}

function champScore(p, overallPick, availSet){
  const s=scores(p);
  const round=Math.ceil(overallPick/league.teams);
  const ph=PHASE_W[phaseOf(myRoundNow())];  // use MY round for strategy phase
  let posScore = ph.role*s.role + ph.off*s.offense + ph.sch*s.schedule + ph.ups*s.upside;
  posScore = posScore * (1 - ph.risk * (s.risk/100));   // risk discount

  const val = valueAt(p, overallPick);
  const valPts = clamp(val, -22, 26) * (ph.val/10);      // scaled value contribution

  const need = needWeight(p.pos);

  const sc = scarcityInfo(p, availSet);
  let scarce=0;
  if(sc.lastInTier && need> -20) scarce += (p.pos==="RB"||p.pos==="TE")?7:5;

  let wl=0;
  if(watch[p.id]==="target") wl=6;
  else if(watch[p.id]==="value") wl=3;
  else if(watch[p.id]==="flyer") wl=(phaseOf(myRoundNow())==="late"?5:1);

  let champ = posScore + valPts + need + scarce + wl;
  if(fade[p.id]) champ = Math.min(champ, 38) - 20;       // fade sinks it

  return clamp(Math.round(champ), 1, 100);
}

function actionOf(champ){
  if(champ>=85) return ["Draft","at-draft"];
  if(champ>=71) return ["Consider","at-consider"];
  return ["Avoid","at-avoid"];
}

/* WHY bullets for a recommendation */
function whyBullets(p, overallPick, availSet){
  const s=scores(p), out=[];
  const val=valueAt(p,overallPick);
  const sc=scarcityInfo(p,availSet);
  const {needs}=rosterFill();
  if(val>=8) out.push(["val", `Value — available ${val} pick${val>1?"s":""} past ADP`]);
  if(sc.lastInTier && (needs[p.pos]>0 || (needs.FLEX>0&&FLEX_POS.includes(p.pos))))
    out.push(["ok", `Last ${p.pos} in Tier ${p.tier} — cliff ahead`]);
  else if(sc.lastInTier)
    out.push(["ok", `Last ${p.pos} in Tier ${p.tier}`]);
  if(needs[p.pos]>0 && p.pos!=="K" && p.pos!=="DST") out.push(["ok",`Fills your ${p.pos} starting need`]);
  else if(needs.FLEX>0 && FLEX_POS.includes(p.pos) && needs[p.pos]===0) out.push(["ok","Fills your FLEX slot"]);
  if(s.offense>=82) out.push(["ok","Elite offensive environment"]);
  if(s.role>=82 && phaseOf(myRoundNow())!=="late") out.push(["ok","Secure, high-volume role"]);
  if(s.upside>=86 && phaseOf(myRoundNow())!=="early") out.push(["ok","League-winning upside"]);
  if(s.schedule>=76) out.push(["ok","Favorable schedule"]);
  if(s.risk<=18) out.push(["ok","Low risk / stable floor"]);
  if(watch[p.id]==="target") out.push(["val","On your Target list"]);
  if(s.risk>=60) out.push(["warn",`Elevated risk (${s.risk})`]);
  if(val<=-8) out.push(["warn",`Ahead of ADP by ${-val} — this is a reach`]);
  if(out.length===0) out.push(["ok",`Best available by Champ Score at ${p.pos}`]);
  return out.slice(0,5);
}

/* legality: should we even recommend this? (avoid dead picks) */
function draftable(p){
  const c=rosterCounts(), S=league.starters, round=myRoundNow();
  if(p.pos==="QB" && c.QB>=1) return false;                 // 1-QB
  if(p.pos==="TE" && c.TE>=2) return false;
  if((p.pos==="K"||p.pos==="DST") && round < league.rounds-2) return false;
  if(p.pos==="K" && c.K>=1) return false;
  if(p.pos==="DST" && c.DST>=1) return false;
  return true;
}

/* full ranked available list for a given pick */
function rankAvailable(overallPick){
  const dset=draftedIds();
  const availSet=new Set(PLAYERS.filter(p=>!dset.has(p.id)).map(p=>p.id));
  return PLAYERS
    .filter(p=>!dset.has(p.id))
    .map(p=>({p, champ:champScore(p,overallPick,availSet), val:valueAt(p,overallPick), availSet}))
    .sort((a,b)=>b.champ-a.champ);
}

/* recommendation object for MY next pick */
function recommendation(){
  const pick = nextMyPick();
  if(pick===null) return null;
  const dset=draftedIds();
  const availSet=new Set(PLAYERS.filter(p=>!dset.has(p.id)).map(p=>p.id));
  const ranked = PLAYERS.filter(p=>!dset.has(p.id) && !fade[p.id])
    .map(p=>({p, champ:champScore(p,pick,availSet)}))
    .sort((a,b)=>b.champ-a.champ);
  // prefer draftable; if the very top isn't draftable (e.g. 2nd QB), find best that is
  const legal = ranked.filter(r=>draftable(r.p));
  const top = (legal[0]||ranked[0]);
  const alts = legal.filter(r=>r.p.id!==top.p.id).slice(0,3);
  const why = whyBullets(top.p, pick, availSet);
  // wait-on: startable-need positions whose best guy is likely to return next time
  const waits=[];
  const tgt = myPickNumbers().find(p=>p>pick) || null;
  if(tgt){
    ["RB","WR","TE","QB"].forEach(pos=>{
      if(needWeight(pos)<=0) return;
      const best = ranked.filter(r=>r.p.pos===pos && draftable(r.p))[0];
      if(best && survivalTo(best.p, tgt) >= 0.6) waits.push(pos);
    });
  }
  return { pick, top, alts, why, waits, tgt };
}

/* ============================================================
   ACTIONS
   ============================================================ */
let undoStack=[];
function pushUndo(){ undoStack.push({drafted:JSON.parse(JSON.stringify(drafted))}); if(undoStack.length>50) undoStack.shift(); }

function draftPlayer(id, by){           // by='me' or team number; auto-advances board
  pushUndo();
  drafted.push({id, by});
  persistDraft(); render();
}
/* mark the current on-the-clock pick with a specific player (keeps snake order honest) */
function draftAtClock(id){
  const by = isMyTurn() ? "me" : overallToTeam(currentOverall());
  draftPlayer(id, by);
}
function undo(){
  const s=undoStack.pop();
  if(!s){ toast("Nothing to undo"); return; }
  drafted = s.drafted; persistDraft(); render(); toast("Undid last pick");
}
function resetDraft(){
  pushUndo(); drafted=[]; persistDraft(); render(); toast("Draft board reset");
}
function setWatch(id, tag){
  if(watch[id]===tag) delete watch[id]; else watch[id]=tag;
  persist("ddai_watch",watch); render();
}
function toggleFade(id){
  if(fade[id]) delete fade[id]; else { fade[id]=true; delete watch[id]; }
  persist("ddai_fade",fade); persist("ddai_watch",watch); render();
}

/* ============================================================
   RENDERING
   ============================================================ */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  $("brandsub").textContent = `${league.name} · ${league.teams}-team`;
  if(ui.mode==="draft"){ $("draftMode").classList.remove("hidden"); $("researchMode").classList.add("hidden"); renderDraft(); }
  else { $("draftMode").classList.add("hidden"); $("researchMode").classList.remove("hidden"); renderResearch(); }
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===ui.mode));
}

function renderDraft(){
  renderHero();
  renderBoard();
  const nP=renderNeeds(), rP=renderRoster(), qP=renderQueue();
  $("needsPanel").innerHTML=nP; $("needsPanelD").innerHTML=nP;
  $("rosterPanel").innerHTML=rP; $("rosterPanelD").innerHTML=rP;
  $("queuePanel").innerHTML=qP; $("queuePanelD").innerHTML=qP;
  // counts
  const dset=draftedIds();
  $("cntBoard").textContent = PLAYERS.length-dset.size;
  $("cntTeam").textContent = myRoster().length;
  $("cntQueue").textContent = Object.keys(watch).length+Object.keys(fade).length;
  // view toggle (mobile)
  ["board","team","queue"].forEach(v=>$("view"+cap(v)).classList.toggle("hidden", ui.view!==v));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===ui.view));
}
const cap=s=>s[0].toUpperCase()+s.slice(1);

function renderHero(){
  const cur=currentOverall();
  const total=league.teams*league.rounds;
  if(drafted.length>=total){
    $("hero").innerHTML=`<div class="rec-empty"><div class="rec-flag">Draft complete</div>
      <div style="font-size:15px">All ${total} picks are in. Head to <b>My Team</b> to review your roster.</div></div>`;
    return;
  }
  const rec=recommendation();
  const onClockTeam=overallToTeam(cur);
  const mine=isMyTurn();
  const myNext=nextMyPick();

  let head=`<div class="hero-top">
    <span class="onclock ${mine?'':'notme'}">${mine?'You are on the clock':'On the clock: Team '+onClockTeam}</span>
    <span class="pickno">Pick <b>${pickLabel(cur)}</b> · Overall <b>${cur}</b></span>
    <span class="timer">
      <span class="clock" id="clock">--</span>
      <button class="clock-btn" id="clockBtn">Start</button>
    </span>
  </div>`;

  let body;
  if(!rec){
    body=`<div class="rec-empty">No more picks for you — your roster is full.</div>`;
  } else {
    const {p}=rec.top, s=scores(p);
    const forLbl = mine ? "Draft now" : `Your next pick: ${pickLabel(myNext)}`;
    const why = rec.why.map(([k,t])=>`<li class="${k}">${esc(t)}</li>`).join("");
    const alts = rec.alts.map((r,i)=>{
      const sv=survivalTag(survivalTo(r.p,rec.tgt));
      return `<div class="opt-row" onclick="openPlayer(${r.p.id})">
        <span class="opt-rank">${i+1}</span>
        <span class="p-pos pc-${r.p.pos}" style="width:auto">${r.p.pos}</span>
        <span style="font-weight:700">${esc(r.p.name)}</span>
        <span class="mini">${r.p.team}</span>
        ${sv?`<span class="sv-chip ${sv.cls}" style="margin-left:auto" title="${sv.pct}% to return at your next pick">${sv.pct}%</span>`:''}
        <span class="opt-sc" style="${sv?'margin-left:8px':'margin-left:auto'}">${r.champ}</span>
      </div>`;}).join("");
    const waitHtml = rec.waits.length
      ? `<div class="waiton">Safe to wait on: ${rec.waits.map(w=>`<b>${w}</b>`).join(", ")} — depth still there.</div>`:"";
    // best available at each position, scored for MY next pick
    const dset=draftedIds();
    const availSet=new Set(PLAYERS.filter(x=>!dset.has(x.id)).map(x=>x.id));
    const posBoxes = POS_ORDER.map(pos=>{
      const best = PLAYERS.filter(x=>!dset.has(x.id) && x.pos===pos)
        .map(x=>({p:x, champ:champScore(x,rec.pick,availSet)}))
        .sort((a,b)=>b.champ-a.champ)[0];
      const lbl = pos==="DST"?"DEF":pos;
      if(!best) return `<div class="posbox pc-${pos} gone"><div class="pb-pos">${lbl}</div>
        <div class="pb-name">—</div><div class="pb-meta"><span class="pb-adp">none left</span></div></div>`;
      const col = best.champ>=85?'var(--go)':best.champ>=71?'var(--gold)':'var(--muted)';
      const sv=survivalTag(survivalTo(best.p,rec.tgt));
      return `<div class="posbox pc-${pos}" onclick="openPlayer(${best.p.id})">
        <div class="pb-pos">${lbl} · ${best.p.pos}${best.p.posRank}</div>
        <div class="pb-name">${esc(best.p.name)}</div>
        <div class="pb-meta"><span class="pb-adp">ADP ${Math.round(best.p.adp)}</span>
          ${sv?`<span class="sv-chip ${sv.cls}">${sv.pct}%</span>`:''}
          <span class="pb-champ" style="color:${col}">${best.champ}</span></div>
      </div>`;
    }).join("");
    body=`<div class="rec-body">
      <div class="rec-flag">${mine?'★ Recommended pick':'Best value if it comes back to you'}</div>
      <div class="rec-main">
        <div class="rec-score"><div class="n">${rec.top.champ}</div><div class="l">Champ</div></div>
        <div class="rec-info">
          <div class="rec-name pc-${p.pos}" style="color:var(--pc)">${esc(p.name)}</div>
          <div class="rec-meta">
            <span class="p-pos pc-${p.pos}" style="width:auto;font-size:14px">${p.pos}${p.posRank}</span>
            <span class="mini">${p.team} · Bye ${s.bye||'—'} · Tier ${p.tier} · ADP ${Math.round(p.adp)}</span>
          </div>
          <ul class="why">${why}</ul>
          ${(()=>{const sv=survivalTag(survivalTo(p,rec.tgt));if(!sv||!rec.tgt)return'';
            const msg=sv.cls==='sv-wait'?`Likely still here at your next pick (${pickLabel(rec.tgt)}) — ${sv.pct}% to return. You can grab a scarcer position first.`
              :sv.cls==='sv-take'?`Won't make it back — only ${sv.pct}% to survive to ${pickLabel(rec.tgt)}. If you want him, it's now.`
              :`Coin flip to return at ${pickLabel(rec.tgt)} (${sv.pct}%).`;
            return `<div class="sv-read ${sv.cls}">${msg}</div>`;})()}
        </div>
      </div>
      <div class="rec-actions">
        <button class="big-draft" onclick="draftAtClock(${p.id})">${mine?'Draft '+esc(firstName(p.name)):'Mark drafted'}</button>
        <button class="ghost" onclick="openPlayer(${p.id})">Details</button>
        <button class="ghost danger" onclick="undo()">↩ Undo</button>
      </div>
      <div class="next-opts split">
        <div class="no-col">
          <div class="lbl">Next best options</div>
          ${alts||'<div class="mini">—</div>'}
          ${waitHtml}
        </div>
        <div class="no-col">
          <div class="lbl">Best available by position</div>
          <div class="posgrid">${posBoxes}</div>
        </div>
      </div>
    </div>
    <div class="panic-bar">
      <button class="panic" onclick="panic()">⚡ Give me the pick</button>
    </div>`;
  }
  $("hero").innerHTML=head+body;
  wireClock();
}
const firstName=n=>n.split(" ")[0];

function boardFiltered(){
  const dset=draftedIds();
  const pick=nextMyPick()||currentOverall();
  let list=rankAvailable(pick);
  const f=ui.posFilter;
  if(f==="FLEX") list=list.filter(r=>FLEX_POS.includes(r.p.pos));
  else if(f!=="ALL") list=list.filter(r=>r.p.pos===f);
  if(ui.search){ const q=ui.search.toLowerCase(); list=list.filter(r=>r.p.name.toLowerCase().includes(q)||r.p.team.toLowerCase().includes(q)); }
  if(ui.sort==="adp") list.sort((a,b)=>a.p.adp-b.p.adp);
  else if(ui.sort==="value") list.sort((a,b)=>b.val-a.val);
  else list.sort((a,b)=>b.champ-a.champ);
  return list;
}

function renderBoard(){
  const list=boardFiltered().slice(0,180);
  const tgt=survivalTarget();
  const html=list.map(r=>{

function renderNeeds(){
  const {needs}=rosterFill();
  const c=rosterCounts(), S=league.starters;
  const rows=[["QB",S.QB],["RB",S.RB],["WR",S.WR],["TE",S.TE],["K",S.K],["DST",S.DST]].map(([pos,req])=>{
    const have=c[pos], pct=req? Math.min(100, have/req*100):0;
    let lbl="Good", cls="good";
    if(have<req){ lbl="Need"; cls="need"; }
    else if(have===req){ lbl="Set"; cls="ok"; }
    else { lbl="Depth"; cls="good"; }
    if(req===0){ lbl=have?"Depth":"—"; cls="good"; }
    return `<div class="need-row pc-${pos}">
      <span class="need-pos">${pos}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="need-lbl ${cls}">${lbl}</span></div>`;
  }).join("");
  const flexNote = needs.FLEX>0?`<div class="mini" style="margin-top:8px">FLEX open: ${needs.FLEX} · best RB/WR/TE fills it</div>`:"";
  // bye-stack warning: 3+ of my players sharing a bye week
  const byeCount={};
  myRoster().forEach(p=>{const b=scores(p).bye; if(b) byeCount[b]=(byeCount[b]||0)+1;});
  const heavy=Object.entries(byeCount).filter(([b,n])=>n>=3).sort((a,b)=>b[1]-a[1]);
  const byeNote = heavy.length
    ? `<div class="bye-warn">⚠ Bye stack: ${heavy.map(([b,n])=>`<b>${n}</b> players on Week ${b}`).join(", ")}</div>`:"";
  return `<h3>Team Needs</h3><div class="needs">${rows}</div>${flexNote}${byeNote}`;
}

let rSortKey="adp", rSortDir=1;
function renderResearch(){
  $("researchHint").innerHTML =
    `<b>Research mode.</b> ADP, dispersion, byes, position, team and tier are live from the Aug 27, 2026 PPR board (~7,800 mock drafts). `+
    `Bye weeks are now real. <b>Sched</b> is still a neutral placeholder (58) — real playoff-weeks strength of schedule lands in the final pre-draft refresh; `+
    `<b>Off</b>, <b>Role</b>, <b>Ceil</b> and <b>Risk</b> start keyed to ADP and are <b>yours to tune</b>. `+
    `Edit any cell and Champ Score + recommendations update live. Use <b>Save → Export</b> to keep your edits.`;
  const dset=draftedIds();
  let list=PLAYERS.slice();
  if(ui.posFilterR!=="ALL") list=list.filter(p=>p.pos===ui.posFilterR);
  if(ui.searchR){const q=ui.searchR.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q));}
  if(ui.hideDrafted) list=list.filter(p=>!dset.has(p.id));
  const pick=nextMyPick()||currentOverall();
  const availSet=new Set(PLAYERS.filter(p=>!dset.has(p.id)).map(p=>p.id));
  const rows=list.map(p=>({p,s:scores(p),champ:champScore(p,pick,availSet)}));
  const key=rSortKey;
  rows.sort((a,b)=>{
    let av,bv;
    if(key==="name"){av=a.p.name;bv=b.p.name;return rSortDir*av.localeCompare(bv);}
    if(["adp","tier"].includes(key)){av=a.p[key];bv=b.p[key];}
    else if(key==="champ"){av=a.champ;bv=b.champ;}
    else {av=a.s[key];bv=b.s[key];}
    return rSortDir*(av-bv);
  });
  const th=(k,l)=>`<th data-k="${k}">${l}${rSortKey===k?(rSortDir>0?' ▲':' ▼'):''}</th>`;
  const head=`<thead><tr>
    ${th("adp","ADP")}${th("name","Player")}<th>Pos</th>${th("tier","Tier")}
    <th>Bye</th>${th("offense","Off")}${th("role","Role")}${th("schedule","Sched")}${th("upside","Ceil")}${th("risk","Risk")}
    ${th("champ","Champ")}<th>Notes</th></tr></thead>`;
  const body=rows.map(({p,s,champ})=>{
    const gone=dset.has(p.id);
    const col={QB:'var(--qb)',RB:'var(--rb)',WR:'var(--wr)',TE:'var(--te)',K:'var(--k)',DST:'var(--dst)'}[p.pos];
    return `<tr style="${gone?'opacity:.4':''}">
      <td class="num">${p.adp}</td>
      <td><span class="rposdot" style="background:${col}"></span><b onclick="openPlayer(${p.id})" style="cursor:pointer">${esc(p.name)}</b> <span class="mini">${p.team}</span></td>
      <td class="num" style="color:${col};font-family:'Saira Condensed';font-weight:700">${p.pos}${p.posRank}</td>
      <td class="num">${p.tier}</td>
      <td><input class="ed" value="${s.bye||''}" data-id="${p.id}" data-f="bye" placeholder="—"></td>
      <td><input class="ed" value="${s.offense}" data-id="${p.id}" data-f="offense"></td>
      <td><input class="ed" value="${s.role}" data-id="${p.id}" data-f="role"></td>
      <td><input class="ed" value="${s.schedule}" data-id="${p.id}" data-f="schedule"></td>
      <td><input class="ed" value="${s.upside}" data-id="${p.id}" data-f="upside"></td>
      <td><input class="ed" value="${s.risk}" data-id="${p.id}" data-f="risk"></td>
      <td class="num" style="font-family:'Saira Condensed';font-weight:800;font-size:16px">${champ}</td>
      <td><input class="r-note" value="${esc(s.note||'')}" data-id="${p.id}" data-f="note" placeholder="add note…"></td>
    </tr>`;
  }).join("");
  $("rtable").innerHTML=head+"<tbody>"+body+"</tbody>";
}

/* ============================================================
   TIMER
   ============================================================ */
let clockInt=null, clockLeft=0;
function wireClock(){
  const btn=$("clockBtn"), cl=$("clock");
  if(!btn) return;
  const paint=()=>{
    const m=Math.floor(clockLeft/60), s=clockLeft%60;
    cl.textContent = clockLeft>0? `${m}:${String(s).padStart(2,'0')}`:"0:00";
    cl.classList.toggle("warn", clockLeft<=15 && clockLeft>0);
  };
  btn.onclick=()=>{
    if(clockInt){ clearInterval(clockInt); clockInt=null; btn.textContent="Start"; return; }
    if(clockLeft<=0) clockLeft=90;
    btn.textContent="Pause";
    clockInt=setInterval(()=>{ clockLeft--; paint(); if(clockLeft<=0){clearInterval(clockInt);clockInt=null;btn.textContent="Start";} },1000);
  };
  if(clockLeft>0) paint();
}

function exportJSON(){
  const data={v:1, league, edits, drafted, watch, fade, ts:Date.now()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`draft-day-ai-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); toast("Snapshot exported");
}
function importJSON(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.league) league=d.league; if(d.edits) edits=d.edits;
      if(d.drafted) drafted=d.drafted; if(d.watch) watch=d.watch; if(d.fade) fade=d.fade;
      persistAll(); closeSave(); render(); toast("Snapshot loaded");
    }catch(e){ toast("Couldn't read that file — is it a Draft Day AI export?"); }
  };
  rd.readAsText(file);
}
function wipeAll(){
  league=structuredClone(DEFAULT_LEAGUE); edits={}; drafted=[]; watch={}; fade={}; undoStack=[];
  persistAll(); render(); toast("Everything reset to defaults");
}

function persist(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k,def){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):def; }catch(e){ return def; } }
function persistDraft(){ persist("ddai_drafted",drafted); }
function persistAll(){ persist("ddai_league",league);persist("ddai_edits",edits);persist("ddai_drafted",drafted);persist("ddai_watch",watch);persist("ddai_fade",fade); }

function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function clampInt(v,a,b){ return clamp(parseInt(v)||a,a,b); }

$("searchR").addEventListener("input",e=>{ui.searchR=e.target.value;renderResearch();});
$("sortSel").addEventListener("change",e=>{ui.sort=e.target.value;renderBoard();});
$("hideDrafted").addEventListener("change",e=>{ui.hideDrafted=e.target.checked;renderResearch();});
$("setBtn").addEventListener("click",openSettings);
$("saveBtn").addEventListener("click",openSave);
$("fileInput").addEventListener("change",e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
$("rtable").addEventListener("click",e=>{const th=e.target.closest("th[data-k]");if(!th)return;const k=th.dataset.k;if(rSortKey===k)rSortDir*=-1;else{rSortKey=k;rSortDir=(k==="name")?1:(k==="adp"||k==="tier"||k==="risk")?1:-1;}renderResearch();});
$("rtable").addEventListener("input",e=>{const el=e.target;if(!el.dataset.id)return;liveEdit(+el.dataset.id,el.dataset.f,el.value);});
[$("modalBg"),$("setBg"),$("saveBg")].forEach(bg=>bg.addEventListener("click",e=>{if(e.target===bg)bg.classList.remove("on");}));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){closeModal();closeSet();closeSave();} if((e.key==="z"||e.key==="Z")&&(e.metaKey||e.ctrlKey)){e.preventDefault();undo();} });

render();
</script></body></html>
